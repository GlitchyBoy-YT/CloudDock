<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — CloudDock</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script defer src="assets/js/main.js"></script><script defer src="assets/js/auth.js"></script></head><body class="auth-page"><header class="site-header"><nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>cloud<span class="brand-light">dock</span></span></a><div class="nav-actions"><button class="theme-toggle" aria-label="Switch color theme"><span class="theme-icon">☼</span></button><a class="nav-login" href="login.html">Sign in</a></div></nav></header><main class="auth-wrap"><section class="auth-card"><span class="auth-eyebrow">GET STARTED</span><h1>Create your account</h1><p class="auth-intro">Set up your CloudDock workspace. Hosting services are not live yet.</p><div class="auth-message" id="auth-message" role="status" aria-live="polite"></div><form class="auth-form" id="auth-form" data-mode="signup"><div class="auth-field"><label for="display-name">Display name</label><input id="display-name" type="text" autocomplete="nickname" maxlength="60" required></div><div class="auth-field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="auth-field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><span class="auth-help">Use a unique password you don't use on other sites.</span></div><button class="button button-primary auth-submit" data-auth-submit type="submit">Create account →</button></form><p class="auth-links">Already have an account? <a href="login.html">Sign in</a></p><p class="auth-legal">By creating an account, you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Notice</a>.</p></section><p class="auth-links"><a href="index.html">← Back to CloudDock</a></p></main></body></html>
