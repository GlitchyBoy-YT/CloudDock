name: CloudDock checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript
        run: |
          node --check assets/js/auth.js
          node --check assets/js/config.js
          node --check assets/js/site.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check --no-lock supabase/functions/control-plane/index.ts
      - name: Check worker
        working-directory: worker
        run: |
          npm install --ignore-scripts
          npm run check
      - name: Verify control-plane files and security policies
        run: |
          test -s index.html
          test -s supabase/functions/control-plane/index.ts
          test -s supabase/migrations/0001_accounts_and_apps.sql
          test -s supabase/migrations/0002_hosting_control_plane.sql
          test -s supabase/migrations/0003_worker_recovery.sql
          grep -q 'enable row level security' supabase/migrations/0002_hosting_control_plane.sql
          grep -q 'clouddock_claim_job' supabase/migrations/0002_hosting_control_plane.sql
          grep -q 'clouddock_enqueue_job' supabase/migrations/0002_hosting_control_plane.sql
          grep -q 'clouddock_reconcile_stale_jobs' supabase/migrations/0003_worker_recovery.sql
          grep -q 'delete_service' supabase/functions/control-plane/index.ts
          grep -q 'delete_secret' supabase/functions/control-plane/index.ts
          grep -q 'CLOUDDOCK_WORKER_TOKEN' worker/src/index.js
          grep -q 'ReadonlyRootfs:true' worker/src/index.js
          grep -q 'CapDrop:\["ALL"\]' worker/src/index.js
