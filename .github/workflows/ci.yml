name: CloudDock checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/js/auth.js
          node --check assets/js/config.js
      - name: Verify required auth and database files
        run: |
          test -s index.html
          test -s assets/js/auth.js
          test -s assets/js/config.js
          test -s supabase/migrations/0001_accounts_and_apps.sql
          grep -q 'create policy "Users can manage their own apps"' supabase/migrations/0001_accounts_and_apps.sql
          grep -q 'enable row level security' supabase/migrations/0001_accounts_and_apps.sql
