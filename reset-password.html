<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password — CloudDock</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script defer src="assets/js/main.js"></script></head><body class="auth-page"><main class="auth-wrap"><section class="auth-card"><span class="auth-eyebrow">ACCOUNT RECOVERY</span><h1>Choose a new password</h1><p class="auth-intro">Enter a new password for your CloudDock account.</p><div class="auth-message" id="auth-message" role="status" aria-live="polite"></div><form class="auth-form" id="password-update-form"><div class="auth-field"><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required></div><button class="button button-primary auth-submit" type="submit">Update password</button></form><p class="auth-links"><a href="login.html">Back to sign in</a></p></section></main><script>document.querySelector("#password-update-form").addEventListener("submit",async e=>{e.preventDefault();const c=window.CLOUDDOCK_SUPABASE_CONFIG||{};const box=document.querySelector("#auth-message");if(!c.url||!c.anonKey||!window.supabase){box.textContent="Connect Supabase in supabase-config.js first.";box.classList.add("visible","error");return}const client=window.supabase.createClient(c.url,c.anonKey);const button=e.currentTarget.querySelector("button");button.disabled=true;const{error}=await client.auth.updateUser({password:document.querySelector("#new-password").value});button.disabled=false;box.textContent=error?error.message:"Password updated. You can now sign in.";box.classList.add("visible");box.classList.toggle("error",Boolean(error));if(!error)setTimeout(()=>location.href="login.html",1200)});</script></body></html>
